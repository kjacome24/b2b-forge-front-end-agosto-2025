<!DOCTYPE html>
<html lang="en">
<head>

    <title>FlorMania</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" >

    <header>

                <div class="cards">
                    <img src="./img/arreglo-tulipanes.jpg" alt="tulipanes">

                        <div>

                        </div>
                        <div>
                    <button class="comprar" onclick="comprar(this)">Comprar</button>

                        </div>
                    </div>
                </div>
                <div class="cards">
                    <img src="./img/arreglo-tulipanes.jpg" alt="tulipanes">
                    <div class="product_details">
                        <div>
                            <p>Ramo de Rosas</p>

                        </div>
                    <button class="comprar" onclick="comprar(this)">Comprar</button>
