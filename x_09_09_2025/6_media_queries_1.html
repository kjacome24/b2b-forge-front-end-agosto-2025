<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: blue;
            font-size: 2rem;
        }
        
        @media (min-width:479px){

                color: red;
                font-size: 4rem;

        @media (min-width:860px){

                font-size: 6rem;
            }
        }

</head>
<body>
    <h1>Hola Mundo</h1>
</body>
</html>
